<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Lab2: 첫 방문자 환영</title>
  <style>
    body { font-family: system-ui, sans-serif; line-height: 1.6; }
    .note { margin-top: 12px; font-size: 14px; opacity: .8; }
  </style>
</head>
<body>
  <h1>Lab2: 웹사이트 첫 방문자 환영 메시지</h1>
  <p>현재 페이지 경로: <code id="path"></code></p>
  <button id="reset">방문기록 초기화</button>

  <script>
  
    console.log("현재페이지경로:", location.pathname);
    document.getElementById("path").textContent = location.pathname;

    const KEY = "hasVisited";

  
    const visited = localStorage.getItem(KEY);
    if (visited !== "true") {
      alert("환영합니다! 처음 방문해주셨네요");
      localStorage.setItem(KEY, "true"); 
    }

    document.getElementById("reset").addEventListener("click", () => {
      localStorage.removeItem(KEY);
      alert("방문기록을 삭제했습니다. 새로고침하면 다시 '첫 방문'처럼 동작합니다.");
    });
  </script>

 
</body>
</html>
