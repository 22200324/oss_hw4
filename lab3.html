<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>사용자 목록</title>
</head>
<body>
  <button id="btn">사용자 불러오기</button>
  <ul id="list"></ul>

  <script>
    document.getElementById("btn").addEventListener("click", () => {
      fetch("https://jsonplaceholder.typicode.com/users")
        .then(res => res.json())            
        .then(users => {
          const list = document.getElementById("list");
          list.innerHTML = "";          
          users.forEach(u => {
            const li = document.createElement("li");
            li.textContent = u.name + " - " + u.email;
; 
            list.appendChild(li);
          });
        });
    });
  </script>
</body>
</html>
